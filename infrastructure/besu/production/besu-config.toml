genesis-file="/etc/besu/genesis.json"
data-path="/var/lib/besu"
node-private-key-file="/run/secrets/besu-node-key"
network-id=2026

p2p-host="0.0.0.0"
p2p-port=30303
discovery-enabled=false
static-nodes-file="/etc/besu/static-nodes.json"
permissions-nodes-config-file-enabled=true
permissions-nodes-config-file="/etc/besu/permissions_config.toml"
# Five-validator ThreadProof baseline: a running validator sees three other
# validator peers when one validator is unavailable. This setting controls Besu
# sync/startup peer selection only and does not weaken QBFT voting/quorum rules.
sync-min-peers=3

host-allowlist=["localhost","127.0.0.1","besu","threadproof-rpc.internal"]
rpc-http-enabled=true
rpc-http-host="0.0.0.0"
rpc-http-port=8545
rpc-http-api=["ETH","NET","WEB3"]

rpc-ws-enabled=true
rpc-ws-host="0.0.0.0"
rpc-ws-port=8546
rpc-ws-api=["ETH","NET","WEB3"]

graphql-http-enabled=false
metrics-enabled=true
metrics-host="0.0.0.0"
metrics-port=9545

# ThreadProof's private QBFT network is configured for zero gas price.
# Change only together with the approved genesis/network policy.
min-gas-price=0
