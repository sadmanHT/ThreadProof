services:
  topology-preflight:
    image: node:22.19.0-alpine3.22
    restart: "no"
    command:
      - node
      - /opt/threadproof/validate-threadproof-production-topology.mjs
    environment:
      THREADPROOF_CHAIN_ID: ${THREADPROOF_CHAIN_ID:-2026}
      THREADPROOF_CONSORTIUM_TOPOLOGY_PATH: /runtime/consortium-topology.json
      THREADPROOF_BESU_GENESIS_PATH: /runtime/genesis.json
      THREADPROOF_BESU_STATIC_NODES_PATH: /runtime/static-nodes.json
      THREADPROOF_BESU_PERMISSIONS_PATH: /runtime/permissions_config.toml
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../../../scripts/validate-threadproof-production-topology.mjs:/opt/threadproof/validate-threadproof-production-topology.mjs:ro
      - ../../../scripts/validate-consortium-topology.mjs:/opt/threadproof/validate-consortium-topology.mjs:ro
      - ../../../scripts/qbft-network-policy.mjs:/opt/threadproof/qbft-network-policy.mjs:ro
      - ${THREADPROOF_CONSORTIUM_TOPOLOGY_PATH:-./consortium-topology.json}:/runtime/consortium-topology.json:ro
      - ${THREADPROOF_BESU_GENESIS_PATH:-./genesis.json}:/runtime/genesis.json:ro
      - ${THREADPROOF_BESU_STATIC_NODES_PATH:-./static-nodes.json}:/runtime/static-nodes.json:ro
      - ${THREADPROOF_BESU_PERMISSIONS_PATH:-./permissions_config.toml}:/runtime/permissions_config.toml:ro

  besu:
    image: hyperledger/besu:26.8.0
    restart: unless-stopped
    depends_on:
      topology-preflight:
        condition: service_completed_successfully
    command:
      - --config-file=/etc/besu/config.toml
    read_only: true
    environment:
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=/opt/besu/native -Djna.tmpdir=/opt/besu/native -Dio.netty.native.workdir=/opt/besu/native
      ROCKSDB_SHAREDLIB_DIR: /opt/besu/native
    tmpfs:
      - /tmp
      - /opt/besu/native:rw,exec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    volumes:
      - besu-data:/var/lib/besu
      - ./besu-config.toml:/etc/besu/config.toml:ro
      - ${THREADPROOF_BESU_GENESIS_PATH:-./genesis.json}:/etc/besu/genesis.json:ro
      - ${THREADPROOF_BESU_NODE_KEY_PATH:-./secrets/besu-node-key}:/run/secrets/besu-node-key:ro
      - ${THREADPROOF_BESU_STATIC_NODES_PATH:-./static-nodes.json}:/etc/besu/static-nodes.json:ro
      - ${THREADPROOF_BESU_PERMISSIONS_PATH:-./permissions_config.toml}:/etc/besu/permissions_config.toml:ro
    ports:
      - 127.0.0.1:8545:8545
      - 127.0.0.1:8546:8546
      - 30303:30303/tcp
      - 30303:30303/udp
    networks:
      - chain

  web3signer:
    image: consensys/web3signer:26.4.2-distroless
    restart: unless-stopped
    depends_on:
      besu:
        condition: service_started
    command:
      - --http-listen-host=0.0.0.0
      - --http-listen-port=9000
      - --http-host-allowlist=localhost,127.0.0.1,web3signer
      - --key-store-path=/var/lib/web3signer/keys
      - eth1
      - --chain-id=2026
      - --downstream-http-host=besu
      - --downstream-http-port=8545
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${THREADPROOF_WEB3SIGNER_KEY_CONFIG_DIR:-./web3signer/keys}:/var/lib/web3signer/keys:ro
    ports:
      - 127.0.0.1:9000:9000
    networks:
      - chain

volumes:
  besu-data:

networks:
  chain:
    driver: bridge
