name: Gemini Live Smoke

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Live Gemini structured-output smoke
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADPROOF_AI_MODEL: gemini-3.7-flash
        run: node apps/web/scripts/test-gemini-live.mjs
