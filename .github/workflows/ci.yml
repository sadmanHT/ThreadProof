name: ThreadProof CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threadproof-ci-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Web typecheck
        run: pnpm --filter @threadproof/web typecheck
      - name: AI trust-boundary regression checks
        run: node apps/web/scripts/test-ai-contract.mjs
      - name: AI adversarial behavior checks
        run: node --experimental-strip-types apps/web/scripts/test-ai-behavior.mjs
      - name: AI observability and evaluation checks
        run: node --experimental-strip-types apps/web/scripts/test-ai-observability.mjs
      - name: AI review privilege-boundary checks
        run: node apps/web/scripts/test-ai-review-security.mjs
      - name: Organization-context regression checks
        run: node apps/web/scripts/test-active-organization-scope.mjs
      - name: Subcontract trust-boundary regression checks
        run: node apps/web/scripts/test-subcontract-contract.mjs
      - name: Credential lifecycle regression checks
        run: node apps/web/scripts/test-credential-lifecycle.mjs
      - name: Worker runtime observability regression checks
        run: node apps/web/scripts/test-runtime-observability.mjs
      - name: Web production build
        run: pnpm --filter @threadproof/web build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Hosted role-workspace tests are opt-in. The password must be supplied as an
      # Actions secret; when absent, only the public authentication-boundary suite runs.
      NEXT_PUBLIC_SUPABASE_URL: https://mgxthhwzsvlxpsombydb.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_LdvioX_0DM6Dwlfwebfc0Q_XiM7VLfs
      THREADPROOF_E2E_DEMO_PASSWORD: ${{ secrets.THREADPROOF_E2E_DEMO_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Playwright Chromium
        run: pnpm --filter @threadproof/web exec playwright install --with-deps chromium
      - name: Browser auth-boundary tests
        run: pnpm --filter @threadproof/web e2e
      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          retention-days: 3
          if-no-files-found: ignore
          path: apps/web/playwright-report/

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Worker typecheck
        run: pnpm --filter @threadproof/worker typecheck
      - name: Production signer policy checks
        run: pnpm --filter @threadproof/worker test:signer-policy

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Contract tooling typecheck
        run: pnpm --filter @threadproof/contracts typecheck
      - name: Smart-contract compile
        run: pnpm --filter @threadproof/contracts compile
      - name: Smart-contract tests
        run: pnpm --filter @threadproof/contracts test
      - name: Local contract deployment smoke test
        run: pnpm --filter @threadproof/contracts deploy:local

  circuits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Circuit invariant shape guard
        run: pnpm --filter @threadproof/circuits test
      - name: Install pinned Circom 2.2.0 compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo install \
            --git https://github.com/iden3/circom.git \
            --rev 9fd40a34f42912ee52230f8b6a114d78f6df1a48 \
            --locked \
            --root "$RUNNER_TEMP/circom" \
            circom
          echo "$RUNNER_TEMP/circom/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/circom/bin/circom" --version | grep -F "2.2.0"
      - name: Compile CapacitySpend circuit
        run: pnpm --filter @threadproof/circuits compile
      - name: Report R1CS information
        run: pnpm --filter @threadproof/circuits info
      - name: Execute adversarial witness tests
        run: pnpm --filter @threadproof/circuits test:witness
      - name: Generate and verify development Groth16 proof
        run: pnpm --filter @threadproof/circuits test:groth16
      - name: Verify generated Groth16 proof through provenance-bound CapacityVault
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/contracts/contracts/generated
          mkdir -p packages/contracts/contracts/generated
          cp packages/circuits/artifacts/CapacitySpendVerifier.sol \
            packages/contracts/contracts/generated/CapacitySpendVerifier.sol
          THREADPROOF_GENERATED_PROOF_DIR="$GITHUB_WORKSPACE/packages/circuits/artifacts" \
            node packages/contracts/scripts/generate-verifier-provenance-wrapper.mjs
          THREADPROOF_GENERATED_PROOF_DIR="$GITHUB_WORKSPACE/packages/circuits/artifacts" \
          THREADPROOF_GENERATED_VERIFIER_SOL="$GITHUB_WORKSPACE/packages/contracts/contracts/generated/CapacitySpendVerifierWithProvenance.sol" \
            pnpm --filter @threadproof/contracts verify:generated
      - name: Upload reproducibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: capacity-spend-zk-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            packages/circuits/artifacts/CapacitySpend.r1cs
            packages/circuits/artifacts/CapacitySpend.sym
            packages/circuits/artifacts/CapacitySpend_js/CapacitySpend.wasm
            packages/circuits/artifacts/CapacitySpendVerifier.sol
            packages/circuits/artifacts/verification_key.json
            packages/circuits/artifacts/proof.json
            packages/circuits/artifacts/public.json
            packages/circuits/artifacts/verifier_provenance.json
            packages/contracts/contracts/generated/CapacitySpendVerifierWithProvenance.sol

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|jks)$|secrets/)' | grep -v '\.env\.example$'; then
            echo "Potential secret file is tracked by Git."
            exit 1
          fi
          if git ls-files 'infrastructure/besu/**/keys/**' | grep -q .; then
            echo "Besu/Web3Signer runtime key material must not be tracked by Git."
            exit 1
          fi
      - name: Enforce production signing and Besu boundaries
        run: node scripts/check-production-boundaries.mjs
      - name: Test consortium topology fail-closed preflight
        run: node scripts/test-consortium-topology-preflight.mjs
      - name: Guard QBFT fault-resilience evidence policy
        run: node scripts/test-qbft-fault-resilience-policy.mjs
      - name: Enforce canonical capacity allocation binding
        run: node scripts/check-capacity-allocation-binding.mjs
      - name: Validate production Besu compose template
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --env-file .env.example \
            -f infrastructure/besu/production/docker-compose.yml \
            config >/dev/null

  pilot-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate disposable five-validator QBFT topology
        run: node scripts/pilot-chain.mjs prepare
      - name: Revalidate generated chain-2026 topology
        env:
          THREADPROOF_CHAIN_ID: "2026"
          THREADPROOF_CONSORTIUM_TOPOLOGY_PATH: infrastructure/besu/pilot/runtime/consortium-topology.json
          THREADPROOF_BESU_GENESIS_PATH: infrastructure/besu/pilot/runtime/genesis.json
          THREADPROOF_BESU_STATIC_NODES_PATH: infrastructure/besu/pilot/runtime/static-nodes.json
          THREADPROOF_BESU_PERMISSIONS_PATH: infrastructure/besu/pilot/runtime/permissions_config.toml
        run: node scripts/validate-consortium-topology.mjs
      - name: Validate pilot Compose graph
        run: docker compose -f infrastructure/besu/pilot/docker-compose.yml config >/dev/null
      - name: Boot and verify five-validator chain 2026
        run: node scripts/pilot-chain.mjs up
      - name: Pilot diagnostics
        if: failure()
        run: docker compose -f infrastructure/besu/pilot/docker-compose.yml logs --no-color || true
      - name: Destroy disposable pilot network
        if: always()
        run: node scripts/pilot-chain.mjs reset
