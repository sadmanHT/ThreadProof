name: ThreadProof Production Readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: threadproof-production-readiness-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  production-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release candidate with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test release-readiness policy
        run: |
          node scripts/test-release-readiness.mjs
          node scripts/test-release-github-evidence.mjs
          node scripts/test-production-deployment-evidence.mjs
          node scripts/test-production-verifier-governance-evidence.mjs
          node scripts/test-production-verifier-governance-template.mjs
          node scripts/test-production-uat-evidence.mjs
          node scripts/test-release-recovery-evidence.mjs
          node scripts/test-production-platform-controls-evidence.mjs
      - name: Re-run production trust-boundary checks
        run: |
          node scripts/check-production-boundaries.mjs
          node scripts/endgame-scorecard.mjs
      - name: Require attested production release manifest
        run: |
          test -f release/production-release.json
          node scripts/check-release-readiness.mjs
      - name: Verify release-bound production deployment evidence
        run: node scripts/verify-release-deployment-evidence.mjs
      - name: Verify release-bound production verifier-governance evidence
        run: node scripts/verify-release-verifier-governance-evidence.mjs
      - name: Verify release-bound production UAT/adversarial evidence
        run: node scripts/verify-release-uat-evidence.mjs
      - name: Verify release-bound production backup/recovery evidence
        run: node scripts/verify-release-recovery-evidence.mjs
      - name: Verify release-bound production platform-controls evidence
        run: node scripts/verify-release-platform-controls-evidence.mjs
      - name: Verify canonical develop workflow evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-github-evidence.mjs
      - name: Require release source to be tested develop history
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(node -e "const m=require('./release/production-release.json'); process.stdout.write(m.release.sourceDevelopCommit)")"
          git fetch origin develop --no-tags
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/develop
      - name: Reject untested code changes after source develop commit
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(node -e "const m=require('./release/production-release.json'); process.stdout.write(m.release.sourceDevelopCommit)")"
          mapfile -t CHANGED < <(git diff --name-only "$SOURCE_COMMIT"..HEAD)
          for file in "${CHANGED[@]}"; do
            case "$file" in
              release/production-release.json|CHANGELOG.md|docs/releases/*)
                ;;
              *)
                echo "Untested production delta after ${SOURCE_COMMIT}: ${file}"
                echo "Code/config changes must return to develop and pass the full exact-head matrix before main promotion."
                exit 1
                ;;
            esac
          done
      - name: Summarize production source
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const manifest = require('./release/production-release.json');
          console.log(`Release: ${manifest.release.version}`);
          console.log(`Tested develop source: ${manifest.release.sourceDevelopCommit}`);
          console.log(`Chain: ${manifest.chain.networkName} (${manifest.chain.chainId})`);
          console.log(`Validators: ${manifest.chain.validatorCount}`);
          console.log('Canonical develop workflow evidence plus release-bound deployment, verifier-governance, UAT/adversarial, backup/recovery and platform-controls evidence are verified before release promotion.');
          console.log('Verifier deployment/provenance and Charter authorization are separate release gates; neither substitutes for the other.');
          console.log('The platform-controls artifact does not enable external controls; the trusted target-side main guard independently rechecks live GitHub protected state.');
          NODE
