name: ThreadProof Clean-State Endgame

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threadproof-clean-state-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  clean-state:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install from lockfile only
        run: pnpm install --frozen-lockfile
      - name: Verify application and worker build boundaries
        run: |
          pnpm --filter @threadproof/web typecheck
          pnpm --filter @threadproof/web build
          pnpm --filter @threadproof/worker typecheck
          pnpm --filter @threadproof/worker test:signer-policy
      - name: Verify contracts and deterministic endgame scorecard
        run: |
          pnpm --filter @threadproof/contracts typecheck
          pnpm --filter @threadproof/contracts compile
          pnpm --filter @threadproof/contracts test
          node scripts/check-production-boundaries.mjs
          node scripts/endgame-scorecard.mjs
      - name: Install pinned Circom 2.2.0 compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo install \
            --git https://github.com/iden3/circom.git \
            --rev 9fd40a34f42912ee52230f8b6a114d78f6df1a48 \
            --locked \
            --root "$RUNNER_TEMP/circom" \
            circom
          echo "$RUNNER_TEMP/circom/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/circom/bin/circom" --version | grep -F "2.2.0"
      - name: Restore exact tracked source before ZK provenance rebuild
        shell: bash
        run: |
          set -euo pipefail
          # Next.js may rewrite this tracked compiler-config file during `next build`.
          # Restore only that known framework mutation, then fail closed on every other
          # tracked modification before the clean-source R1CS attestation runs.
          git restore --source=HEAD --worktree -- apps/web/tsconfig.json
          tracked_status="$(git status --porcelain --untracked-files=no)"
          if [ -n "$tracked_status" ]; then
            echo "Tracked source checkout is not clean before ZK provenance rebuild:"
            printf '%s\n' "$tracked_status"
            exit 1
          fi
      - name: Rebuild both ZK circuits from source
        run: |
          rm -rf packages/circuits/artifacts packages/contracts/contracts/generated
          pnpm --filter @threadproof/circuits test
          pnpm --filter @threadproof/circuits compile
          pnpm --filter @threadproof/circuits compile:release
          pnpm --filter @threadproof/circuits test:witness
          pnpm --filter @threadproof/circuits test:release:witness
          pnpm --filter @threadproof/circuits test:groth16
          pnpm --filter @threadproof/circuits test:release:groth16
      - name: Bind generated verifiers to exact circuit provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/contracts/contracts/generated
          cp packages/circuits/artifacts/CapacitySpendVerifier.sol packages/contracts/contracts/generated/CapacitySpendVerifier.sol
          cp packages/circuits/artifacts/CapacityReleaseVerifier.sol packages/contracts/contracts/generated/CapacityReleaseVerifier.sol
          THREADPROOF_GENERATED_PROOF_DIR="$GITHUB_WORKSPACE/packages/circuits/artifacts" node packages/contracts/scripts/generate-verifier-provenance-wrapper.mjs
          THREADPROOF_GENERATED_PROOF_DIR="$GITHUB_WORKSPACE/packages/circuits/artifacts" node packages/contracts/scripts/generate-release-verifier-provenance-wrapper.mjs
      - name: Boot disposable five-validator chain 2026
        run: |
          pnpm pilot:reset
          pnpm pilot:prepare
          pnpm pilot:up
          pnpm pilot:verify
      - name: Deploy protocol and measure live QBFT worker inclusion
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . infrastructure/besu/pilot/runtime/pilot.env
          set +a
          export THREADPROOF_DEPLOYMENT_OUTPUT_PATH="$GITHUB_WORKSPACE/infrastructure/besu/pilot/runtime/deployment.json"
          pnpm --filter @threadproof/contracts deploy:local --network threadproofLocal
          pnpm --filter @threadproof/worker test:pilot-live
      - name: Execute live PoFC-backed subcontract and capacity release
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . infrastructure/besu/pilot/runtime/pilot.env
          set +a
          export THREADPROOF_GENERATED_PROOF_DIR="$GITHUB_WORKSPACE/packages/circuits/artifacts"
          pnpm --filter @threadproof/contracts verify:live-subcontract --network threadproofLocal
          pnpm --filter @threadproof/contracts verify:live-capacity-release --network threadproofLocal
          pnpm pilot:verify
      - name: Pilot diagnostics
        if: failure()
        run: docker compose -f infrastructure/besu/pilot/docker-compose.yml logs --no-color || true
      - name: Destroy disposable pilot network
        if: always()
        run: pnpm pilot:reset
      - name: Upload clean-state evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: threadproof-clean-state-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/endgame-scorecard.json
            artifacts/contract-gas-benchmark.json
            artifacts/live-qbft-benchmark.json
            packages/circuits/artifacts/CapacitySpend_benchmark.json
            packages/circuits/artifacts/CapacityRelease_benchmark.json
            packages/circuits/artifacts/valid-input.json
            packages/circuits/artifacts/proof.json
            packages/circuits/artifacts/public.json
            packages/circuits/artifacts/verification_key.json
            packages/circuits/artifacts/verifier_provenance.json
            packages/circuits/artifacts/ceremony-validation/build-verification/CapacitySpend_build_attestation.json
            packages/circuits/artifacts/ceremony-validation/build-verification/CapacitySpend_build_attestation.json.sha256
            packages/circuits/artifacts/ceremony-validation/CapacitySpend_ceremony_evidence.json
            packages/circuits/artifacts/ceremony-validation/CapacitySpend_ceremony_evidence.json.sha256
            packages/circuits/artifacts/release-valid-input.json
            packages/circuits/artifacts/release_proof.json
            packages/circuits/artifacts/release_public.json
            packages/circuits/artifacts/release_verification_key.json
            packages/circuits/artifacts/release_verifier_provenance.json
            packages/circuits/artifacts/release-ceremony-validation/build-verification/CapacityRelease_build_attestation.json
            packages/circuits/artifacts/release-ceremony-validation/build-verification/CapacityRelease_build_attestation.json.sha256
            packages/circuits/artifacts/release-ceremony-validation/CapacityRelease_ceremony_evidence.json
            packages/circuits/artifacts/release-ceremony-validation/CapacityRelease_ceremony_evidence.json.sha256
            packages/contracts/contracts/generated/CapacitySpendVerifierWithProvenance.sol
            packages/contracts/contracts/generated/CapacityReleaseVerifierWithProvenance.sol
