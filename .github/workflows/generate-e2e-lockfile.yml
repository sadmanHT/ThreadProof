name: Generate E2E Lockfile

on:
  push:
    branches: [automation/e2e-lockfile]
    paths:
      - apps/web/package.json
      - .github/workflows/generate-e2e-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve pinned workspace lockfile
        run: pnpm install --lockfile-only
      - name: Commit generated lockfile to disposable branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore(e2e): update generated lockfile"
          git push origin HEAD:automation/e2e-lockfile
