name: Generate E2E Lockfile

on:
  push:
    branches: [automation/e2e-lockfile]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve pinned workspace lockfile
        run: pnpm install --lockfile-only
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: e2e-lockfile-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: pnpm-lock.yaml
