name: ThreadProof Live Capacity Release

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threadproof-live-capacity-release-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  live-capacity-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Contract tooling typecheck
        run: pnpm --filter @threadproof/contracts typecheck
      - name: Capacity release contract tests
        run: pnpm --filter @threadproof/contracts test -- --grep "CapacityVault release"
      - name: Install pinned Circom 2.2.0 compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo install \
            --git https://github.com/iden3/circom.git \
            --rev 9fd40a34f42912ee52230f8b6a114d78f6df1a48 \
            --locked \
            --root "$RUNNER_TEMP/circom" \
            circom
          echo "$RUNNER_TEMP/circom/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/circom/bin/circom" --version | grep -F "2.2.0"
      - name: Guard spend and release circuit invariants
        run: pnpm --filter @threadproof/circuits test
      - name: Compile spend and release circuits
        run: |
          pnpm --filter @threadproof/circuits compile
          pnpm --filter @threadproof/circuits compile:release
      - name: Build canonical spend and release witnesses and reject adversarial witnesses
        run: |
          pnpm --filter @threadproof/circuits test:witness
          pnpm --filter @threadproof/circuits test:release:witness
      - name: Generate and verify development spend Groth16 proof
        run: pnpm --filter @threadproof/circuits test:groth16
      - name: Generate and verify development release Groth16 proof
        run: pnpm --filter @threadproof/circuits test:release:groth16
      - name: Bind spend and release verifiers to circuit provenance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/contracts/contracts/generated
          mkdir -p packages/contracts/contracts/generated
          cp packages/circuits/artifacts/CapacitySpendVerifier.sol \
            packages/contracts/contracts/generated/CapacitySpendVerifier.sol
          cp packages/circuits/artifacts/CapacityReleaseVerifier.sol \
            packages/contracts/contracts/generated/CapacityReleaseVerifier.sol
          THREADPROOF_GENERATED_PROOF_DIR="$GITHUB_WORKSPACE/packages/circuits/artifacts" \
            node packages/contracts/scripts/generate-verifier-provenance-wrapper.mjs
          THREADPROOF_GENERATED_PROOF_DIR="$GITHUB_WORKSPACE/packages/circuits/artifacts" \
            node packages/contracts/scripts/generate-release-verifier-provenance-wrapper.mjs
      - name: Boot fresh five-validator chain 2026
        run: |
          pnpm pilot:prepare
          pnpm pilot:up
      - name: Execute PoFC spend, cancellation, and cryptographic capacity release
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . infrastructure/besu/pilot/runtime/pilot.env
          set +a
          export THREADPROOF_GENERATED_PROOF_DIR="$GITHUB_WORKSPACE/packages/circuits/artifacts"
          pnpm --filter @threadproof/contracts verify:live-capacity-release --network threadproofLocal
      - name: Pilot diagnostics
        if: failure()
        run: docker compose -f infrastructure/besu/pilot/docker-compose.yml logs --no-color || true
      - name: Destroy disposable pilot network
        if: always()
        run: pnpm pilot:reset
      - name: Upload capacity-release reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-capacity-release-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            packages/circuits/artifacts/valid-input.json
            packages/circuits/artifacts/proof.json
            packages/circuits/artifacts/public.json
            packages/circuits/artifacts/verification_key.json
            packages/circuits/artifacts/verifier_provenance.json
            packages/circuits/artifacts/release-valid-input.json
            packages/circuits/artifacts/release_proof.json
            packages/circuits/artifacts/release_public.json
            packages/circuits/artifacts/release_verification_key.json
            packages/circuits/artifacts/release_verifier_provenance.json
            packages/contracts/contracts/generated/CapacitySpendVerifierWithProvenance.sol
            packages/contracts/contracts/generated/CapacityReleaseVerifierWithProvenance.sol
