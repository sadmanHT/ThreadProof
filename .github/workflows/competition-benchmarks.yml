name: ThreadProof Competition Benchmarks

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/competition-benchmarks.yml"
      - "packages/circuits/**"
      - "packages/contracts/**"
      - "apps/worker/scripts/pilot-live-runtime.ts"
      - "apps/worker/src/**"
      - "scripts/competition-benchmark-report.mjs"
      - "scripts/pilot-chain.mjs"
      - "scripts/pilot-fault-resilience.mjs"
      - "infrastructure/besu/pilot/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threadproof-competition-benchmarks-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate circuit policy and versioned vectors
        run: pnpm --filter @threadproof/circuits test

      - name: Install pinned Circom 2.2.0 compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo install \
            --git https://github.com/iden3/circom.git \
            --rev 9fd40a34f42912ee52230f8b6a114d78f6df1a48 \
            --locked \
            --root "$RUNNER_TEMP/circom" \
            circom
          echo "$RUNNER_TEMP/circom/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/circom/bin/circom" --version | grep -F "2.2.0"

      - name: Compile CapacitySpend from exact source
        run: pnpm --filter @threadproof/circuits compile

      - name: Execute versioned witness vectors
        run: pnpm --filter @threadproof/circuits test:witness

      - name: Measure canonical witness generation
        run: pnpm --filter @threadproof/circuits benchmark:witness

      - name: Generate development Groth16 proof and exact-source attestations
        run: pnpm --filter @threadproof/circuits test:groth16

      - name: Generate provenance-bound Solidity verifier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/contracts/contracts/generated
          mkdir -p packages/contracts/contracts/generated
          cp packages/circuits/artifacts/CapacitySpendVerifier.sol \
            packages/contracts/contracts/generated/CapacitySpendVerifier.sol
          THREADPROOF_GENERATED_PROOF_DIR="$GITHUB_WORKSPACE/packages/circuits/artifacts" \
            node packages/contracts/scripts/generate-verifier-provenance-wrapper.mjs
          THREADPROOF_GENERATED_PROOF_DIR="$GITHUB_WORKSPACE/packages/circuits/artifacts" \
          THREADPROOF_GENERATED_VERIFIER_SOL="$GITHUB_WORKSPACE/packages/contracts/contracts/generated/CapacitySpendVerifierWithProvenance.sol" \
            pnpm --filter @threadproof/contracts verify:generated

      - name: Measure representative contract gas
        run: pnpm --filter @threadproof/contracts exec hardhat test test/GasSnapshot.spec.ts

      - name: Measure canonical capacity concurrency
        run: pnpm --filter @threadproof/contracts benchmark:concurrency

      - name: Generate disposable five-validator QBFT topology
        run: pnpm pilot:prepare

      - name: Boot five-validator chain 2026
        run: pnpm pilot:up

      - name: Deploy ThreadProof contracts for worker benchmark
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . infrastructure/besu/pilot/runtime/pilot.env
          set +a
          export THREADPROOF_DEPLOYMENT_OUTPUT_PATH="$GITHUB_WORKSPACE/infrastructure/besu/pilot/runtime/deployment.json"
          pnpm --filter @threadproof/contracts deploy:local --network threadproofLocal

      - name: Measure live QBFT confirmation through worker signer path
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . infrastructure/besu/pilot/runtime/pilot.env
          set +a
          export THREADPROOF_DEPLOYMENT_OUTPUT_PATH="$GITHUB_WORKSPACE/infrastructure/besu/pilot/runtime/deployment.json"
          pnpm --filter @threadproof/worker test:pilot-live

      - name: Measure generated Groth16 verifier gas on chain 2026
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . infrastructure/besu/pilot/runtime/pilot.env
          set +a
          export THREADPROOF_GENERATED_PROOF_DIR="$GITHUB_WORKSPACE/packages/circuits/artifacts"
          pnpm --filter @threadproof/contracts benchmark:verifier --network threadproofLocal

      - name: Execute and measure complete live PoFC spend
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . infrastructure/besu/pilot/runtime/pilot.env
          set +a
          export THREADPROOF_GENERATED_PROOF_DIR="$GITHUB_WORKSPACE/packages/circuits/artifacts"
          pnpm --filter @threadproof/contracts verify:live-pofc --network threadproofLocal

      - name: Measure QBFT quorum-loss fail-closed behavior
        env:
          THREADPROOF_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm pilot:fault-resilience

      - name: Assemble exact-SHA competition benchmark report
        env:
          THREADPROOF_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm benchmarks:report

      - name: Upload competition benchmark evidence
        uses: actions/upload-artifact@v7
        with:
          name: threadproof-competition-benchmarks-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/competition-benchmark-report.json
            artifacts/competition-benchmark-report.json.sha256
            artifacts/contract-gas-benchmark.json
            artifacts/capacity-concurrency-benchmark.json
            artifacts/live-qbft-benchmark.json
            artifacts/live-pofc-benchmark.json
            packages/circuits/artifacts/CapacitySpend_benchmark.json
            packages/circuits/artifacts/CapacitySpend_witness_benchmark.json
            packages/circuits/artifacts/CapacitySpend_verifier_gas.json
            packages/circuits/artifacts/witness-tests/vector-results.json
            infrastructure/besu/pilot/runtime/qbft-fault-resilience.json
            infrastructure/besu/pilot/runtime/qbft-fault-resilience.json.sha256

      - name: Pilot diagnostics
        if: failure()
        run: docker compose -f infrastructure/besu/pilot/docker-compose.yml logs --no-color || true

      - name: Destroy disposable pilot network
        if: always()
        run: pnpm pilot:reset
