name: ThreadProof Release Policy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threadproof-release-policy-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test production release manifest policy
        run: node scripts/test-release-readiness.mjs
      - name: Test release-bound production ceremony evidence policy
        run: node scripts/test-release-ceremony-evidence.mjs
      - name: Test production deployment evidence policy
        run: |
          node scripts/test-production-deployment-evidence.mjs
          node scripts/test-production-deployment-template.mjs
      - name: Test production verifier-governance evidence policy
        run: |
          node scripts/test-production-verifier-governance-evidence.mjs
          node scripts/test-production-verifier-governance-template.mjs
      - name: Test production evidence capture policy
        run: node scripts/test-production-evidence-capture.mjs
      - name: Test production UAT evidence policy
        run: |
          node scripts/test-production-uat-evidence.mjs
          node scripts/test-production-uat-template.mjs
      - name: Test production backup/recovery release-binding policy
        run: node scripts/test-release-recovery-evidence.mjs
      - name: Test production platform-controls evidence policy
        run: |
          node scripts/test-production-platform-controls-evidence.mjs
          node scripts/test-production-platform-controls-template.mjs
      - name: Test canonical release GitHub evidence binding
        run: node scripts/test-release-github-evidence.mjs
      - name: Verify canonical evidence workflow concurrency
        run: node scripts/test-workflow-evidence-concurrency.mjs
      - name: Guard supported GitHub Action runtimes
        run: node scripts/test-github-action-runtime-policy.mjs
      - name: Verify production manifest is not committed prematurely
        if: github.ref_name != 'main' && github.event.pull_request.base.ref != 'main'
        shell: bash
        run: |
          set -euo pipefail
          if test -f release/production-release.json; then
            echo "A production release manifest is release-specific evidence and must be added only on a controlled main-promotion branch."
            exit 1
          fi
